# Top level is the default for `wrangler dev` and mirrors staging, so a bare
# `wrangler deploy` can never hit production. Bindings, vars, and secrets are not
# inherited by environments, so each env repeats them.
name = "handsift-api-staging"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Served on *.workers.dev until production gets a custom domain. Preview URLs (public
# per-version URLs) are off: nothing should reach the API except through the main URL.
workers_dev = true
preview_urls = false

[observability]
enabled = true

[secrets]
required = ["ETSY_API_KEY"]

[vars]
# Comma-separated Chrome extension IDs allowed by the origin check. Empty = any extension.
ALLOWED_EXTENSION_IDS = ""

# Per-IP rate limit, per Cloudflare location. period must be 10 or 60 seconds.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Shared listing cache (Phase 10). Local `wrangler dev` uses a local SQLite copy.
[[d1_databases]]
binding = "DB"
database_name = "handsift-staging"
database_id = "4bc22f08-6f69-4367-9ea5-6308a5c22f94"
migrations_dir = "migrations"

# Hourly cleanup of expired cache rows.
[triggers]
crons = ["0 * * * *"]

[env.staging]
name = "handsift-api-staging"
workers_dev = true
preview_urls = false

[env.staging.observability]
enabled = true

[env.staging.secrets]
required = ["ETSY_API_KEY"]

[env.staging.vars]
ALLOWED_EXTENSION_IDS = ""

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "handsift-staging"
database_id = "4bc22f08-6f69-4367-9ea5-6308a5c22f94"
migrations_dir = "migrations"

[env.staging.triggers]
crons = ["0 * * * *"]

[env.production]
name = "handsift-api"
workers_dev = true
preview_urls = false

[env.production.observability]
enabled = true

[env.production.secrets]
required = ["ETSY_API_KEY"]

[env.production.vars]
# Set to the Chrome Web Store extension ID once it exists (Phase 12).
ALLOWED_EXTENSION_IDS = ""

[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[[env.production.d1_databases]]
binding = "DB"
database_name = "handsift-prod"
database_id = "6e882d76-c402-4e40-b2ce-0f38567ac3f3"
migrations_dir = "migrations"

[env.production.triggers]
crons = ["0 * * * *"]
