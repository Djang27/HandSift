name: CI

on:
  # Branch pushes are covered by their pull request; this avoids running CI twice per PR.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole workflow first.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm depcruise

      # Staging Worker URL is a repository variable (Settings > Secrets and variables >
      # Actions > Variables). Until staging exists (Phase 2), fall back to localhost.
      - name: Build extension (staging)
        env:
          WXT_WORKER_URL: ${{ vars.STAGING_WORKER_URL || 'http://localhost:8787' }}
        run: |
          if [ -z "${{ vars.STAGING_WORKER_URL }}" ]; then
            echo "::warning::STAGING_WORKER_URL is not set; extension built against http://localhost:8787"
          fi
          pnpm --filter @handsift/extension zip

      - uses: actions/upload-artifact@v7
        with:
          name: extension-chrome-mv3
          path: apps/extension/.output/*.zip
          if-no-files-found: error
          # WXT's output dir (.output) is hidden; upload-artifact skips hidden paths by default.
          include-hidden-files: true

      # End-to-end: HandSift in real Chromium against a mock Worker (apps/extension/e2e).
      - name: Install Playwright's Chromium
        run: pnpm --filter @handsift/extension exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/extension/playwright-report
            apps/extension/test-results
          if-no-files-found: ignore
